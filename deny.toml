# Project policies.
#
# These policies can be enforced using `cargo deny check`.

[advisories]
ignore = []

[licenses]
# Allow common non-restrictive licenses. ISC is used for various DNS and crypto
# things, and it's a minimally restrictive open source license.
# Licenses not in this list will be denied (including copyleft and AGPL).
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # CDLA-Permissive-2.0 is used by webpki-root-certs for Mozilla root CA data.
    # It's a permissive data license appropriate for certificate data.
    "CDLA-Permissive-2.0",
]

[bans]
# In theory it's nice to catch duplicate dependencies, but in practice it
# provides hundreds of lines warning spam and almost never catches any
# real issues. We have replaced this with a short list
multiple-versions = "allow"

deny = [
    # OpenSSL has caused endless deployment and build problems. We use rustls
    # for TLS everywhere, and diesel-async with tokio-postgres (pure Rust) for
    # database connections.
    { name = "openssl" },
    { name = "openssl-sys" },

    # --- Duplication here is a silent runtime bug, not a compile error. ---
    #
    # This list was compiled by a friendly neighborhood LLM based on its
    # own ambient background knowledge of common silent failures (like
    # tracing).
    #
    # Note that listing a crate here with `deny-multiple-versions` does not ban
    # the crate itself, it only bans having two versions of it.

    # The global default dispatcher lives in statics inside tracing-core. With
    # two copies, code linked against copy B sends spans/events to B's
    # never-initialized default dispatcher: logs just vanish, no error.
    { name = "tracing-core", deny-multiple-versions = true },

    # Same failure mode as tracing-core: one global logger in a static, so a
    # second copy silently drops everything logged through it.
    { name = "log", deny-multiple-versions = true },

    # Owns process-global signal state (the shared forwarding pipe + handler).
    # Two copies means two registries; the OS only remembers one handler, so
    # e.g. tokio's ctrl_c() can stop firing mysteriously.
    { name = "signal-hook-registry", deny-multiple-versions = true },

    # Thread-local errno is per-copy: a library sets errno in copy A and reads
    # it in copy B, and reports the wrong error.
    { name = "errno", deny-multiple-versions = true },

    # These compile C/asm and export a shared C symbol namespace (`aws_lc_*`,
    # `ring_*`/`GFp_*`). Two versions still link: the linker just resolves both
    # Rust wrappers against whichever object file it saw first, i.e. silent ABI
    # skew inside our crypto backend. This is the one class where a dupe is
    # undefined behavior rather than a type error.
    { name = "aws-lc-sys", deny-multiple-versions = true },
    { name = "ring", deny-multiple-versions = true },
]
